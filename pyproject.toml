[project]
name = "wav2vec2"
version = "0.1.0"
description = "Implementation of wav2vec 2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0",
  "torchaudio>=2.11.0",
]
cu124 = [
  "torch>=2.11.0",
  "torchaudio>=2.11.0",
]
cu130 = [
  "torch>=2.11.0",
  "torchaudio>=2.11.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu124" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu124" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
