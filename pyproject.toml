[project]
name = "wav2vec2"
version = "0.1.0"
description = "Implementation of wav2vec 2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dacite>=1.9.2",
    "einops>=0.8.2",
    "lightning>=2.6.6",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "wandb>=0.30.0",
]

[project.scripts]
wav2vec2 = "wav2vec2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wav2vec2"]

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0",
  "torchaudio>=2.11.0",
]
cu126 = [
  "torch>=2.11.0",
  "torchaudio>=2.11.0",
]
cu130 = [
  "torch>=2.11.0",
  "torchaudio>=2.11.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
